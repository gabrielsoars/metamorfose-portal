services:
  application_db:
    image: postgres:15
    container_name: meu_banco_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  monolito:
    build: ./monolito                  # Diz ao Docker para ler o Dockerfile desta pasta
    container_name: backend_monolito
    restart: always
    ports:
      - "8000:8000"                    # Mapeia a porta 8000 do Windows para a 8000 do contêiner
    environment:
      - DB_HOST=application_db         # O FastAPI usará este nome para achar o banco de dados na rede!
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - APP_ENV=${APP_ENV:-development}
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private_key
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - JWT_ISSUER=${JWT_ISSUER:-metamorfose-monolito}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-metamorfose-scan-service}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-nao-responda@metamorfose.local}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_NOME=${ADMIN_NOME:-Administrador}
    secrets:
      - jwt_private_key                # Só o monolito assina tokens
    depends_on:
      - application_db                 # Garante que o banco suba antes do monolito
    volumes:
      - ./monolito:/app  
  frontend_web:
    build: ./frontend
    container_name: react_frontend
    ports:
      - "5173:5173"
    volumes:
      # Aqui está a mágica do Hot-Reload! 
      # Espelhamos a sua pasta do Windows para dentro do contêiner.
      - ./frontend:/app
      # Esta linha protege a pasta node_modules de conflitos entre o Windows e o Linux do contêiner
      - /app/node_modules
    environment:
      # As chamadas passam pelo proxy do Vite (/api e /scan-api), funcionando no PC e no celular/túnel.
      - VITE_API_URL=/api
      - VITE_SCAN_URL=/scan-api
      - VITE_PROXY_TARGET=http://monolito:8000
      - VITE_SCAN_PROXY_TARGET=http://scan_service:8001
    depends_on:
      - monolito
  scan_service:
    build: ./scan_service
    container_name: backend_scan
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=application_db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - APP_ENV=${APP_ENV:-development}
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - JWT_ISSUER=${JWT_ISSUER:-metamorfose-monolito}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-metamorfose-scan-service}
    secrets:
      - jwt_public_key                 # O scan só valida tokens, nunca emite
    depends_on:
      - application_db
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: monitoring_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.1.0
    container_name: monitoring_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

# Gere as chaves antes de subir (ver README). Use um par diferente por ambiente.
secrets:
  jwt_private_key:
    file: ./keys/jwt_private.pem
  jwt_public_key:
    file: ./keys/jwt_public.pem